apiVersion: v1
kind: Service
metadata:
  name: pru-market-gen-service
  namespace: pru-market-gen-ns
  labels:
    app: pru-market-gen
spec:
  type: ClusterIP # Internal service - use with Ingress for external access
  selector:
    app: pru-market-gen # Must match labels on the Pod template
  ports:
  - port: 80 # Service listens on port 80
    targetPort: 3001 # Forward traffic to the container's named port 'http' (3001)
    protocol: TCP
    name: http # Name the service port
