apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pru-market-gen-hpa
  namespace: pru-market-gen-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pru-market-gen-deployment # Target the correct deployment
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization # Average utilization across all pods
        averageUtilization: 80 # Target 80% CPU utilization
  # Consider adding memory-based scaling if your app is memory-bound
  # - type: Resource
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization # Or AverageValue for raw Mi/Gi target
  #       averageUtilization: 75
  # GPU utilization scaling is complex and often not the primary scaling metric.
  # Usually scale based on CPU/Memory/QueueLength/RPS first.
  # behavior: # Optional: Control scale-up/down speed
  #   scaleDown:
  #     stabilizationWindowSeconds: 300 # Wait 5 minutes before scaling down
  #     policies:
  #     - type: Percent
  #       value: 100 # Remove all necessary pods at once
  #       periodSeconds: 60
  #   scaleUp:
  #     stabilizationWindowSeconds: 0 # Scale up immediately
  #     policies:
  #     - type: Percent
  #       value: 100 # Add 100% of current replicas if needed (max 4/step)
  #       periodSeconds: 15
  #     - type: Pods
  #       value: 4 # Add max 4 pods at once
  #       periodSeconds: 15
  #     selectPolicy: Max # Use the policy that allows adding more pods
